name: SHCooldowns
version: '${project.version}'
main: org.Cry_Legende.sHCooldowns.SHCooldowns
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, les cooldowns restent locaux à chaque serveur comme avant.
softdepend: [PlaceholderAPI, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (cooldowns en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shcooldowns:
    description: Commandes administratives pour SHCooldowns.
    usage: /shcooldowns <reload|info|reset>

permissions:
  shcooldowns.admin:
    description: Toute l'administration de SHCooldowns
    default: op
    children:
      shcooldowns.admin.reload: true
      shcooldowns.admin.info: true
      shcooldowns.admin.reset: true
  shcooldowns.admin.reload:
    description: Recharger config.yml et messages.yml
    default: op
  shcooldowns.admin.info:
    description: Consulter les cooldowns actifs d'un joueur
    default: op
  shcooldowns.admin.reset:
    description: Retirer un cooldown (ou tous) d'un joueur
    default: op
  shcooldowns.bypass.<cooldown_id>: # Ex: shcooldowns.bypass.repair
    description: Permet de contourner un cooldown spécifique (utiliser l'id du config).
    default: false
  shcooldowns.bypass.all:
    description: Permet de contourner tous les cooldowns SHCooldowns.
    default: false
