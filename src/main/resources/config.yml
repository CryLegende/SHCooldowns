# Configuration for SHCooldowns
# Placeholders: %time% for remaining time
cooldown_message: "&7&l« &6&lSH &7&l» &7Veuillez attendre &6%time% &7avant d'utiliser cette commande à nouveau."
no_permission_message: "§7§l« §f§lSH §8§l» §fCommande inconnue, essayez autre chose." # Ajout pour clarté

cooldowns:
  # ID unique pour le groupe de cooldown (sera utilisé pour PAPI et permissions bypass)
  repair:
    # Cooldown appliqué si aucune entrée avec permission correspondante n'est trouvée ou si le joueur n'a pas la permission spécifiée
    default:
      cooldown: 24h # 24 heures
      shared_commands: # Commandes partageant ce cooldown PAR DÉFAUT
        - /fix # Commande de base, correspond aussi à /repair xyz sauf si une règle plus spécifique existe
    # vip:
    #   cooldown: 12h # 12 heures pour les VIPs
    #   permission: shcooldowns.repairvip # Permission requise pour ce cooldown
    #   shared_commands: # Commandes partageant ce cooldown VIP
    #     - /repair
    #     - /erepair
    #     - /fix
    #     - /efix
    #     - /repair hand
    #     - /erepair hand
    #     - /fix hand
    #     - /efix hand
  repair_all:
    default:
      cooldown: 72h # 72 heures
      shared_commands:
        - /fix *
  kittycannon:
    default:
      cooldown: 10s # 10 secondes
      shared_commands:
        - /kittycannon
        - /ekittycannon

