# ======================================================================== #
# SHCooldowns
#
# Plugin : cooldowns partagés par groupe de commandes, durée selon la permission, alias de commandes et placeholders.
# Avec SHNetwork, un cooldown pris sur un serveur bloque aussi la commande sur les autres (voir la section 'reseau'
# en bas du fichier).
#
# Commande (alias : aucun) :
#   /shcooldowns reload                 Relit ce fichier et messages.yml. Un fichier illisible ne change rien. Les
#                                       cooldowns en cours sont conservés ; les clés de 'reseau' demandent un redémarrage.
#   /shcooldowns info <joueur>          Cooldowns actifs d'un joueur (joueur connecté ou UUID) et temps restant.
#   /shcooldowns reset <joueur> [id|all]  Retire le cooldown d'un groupe, ou tous sans id (en mode réseau, aussi en base).
#
# Permissions :
#   shcooldowns.admin                 Toutes les sous-commandes (par défaut : op).
#   shcooldowns.admin.reload          /shcooldowns reload
#   shcooldowns.admin.info            /shcooldowns info
#   shcooldowns.admin.reset           /shcooldowns reset
#   shcooldowns.bypass.<id>           Ignorer le cooldown du groupe <id> (par exemple shcooldowns.bypass.repair).
#   shcooldowns.bypass.all            Ignorer tous les cooldowns.
#   permission: d'une entrée          Durée réservée aux joueurs qui ont ce nœud (par exemple shcooldowns.repairvip).
#
# Placeholder : %shcooldowns_time_<id>% = temps restant du groupe <id> pour le joueur.
#
# cooldown_message : message envoyé pendant un cooldown (%time%). no_permission_message : refus de /shcooldowns.
# cooldowns.<id>.default / .<palier> : cooldown (durée 24h, 30m, 10s...), shared_commands, permission du palier.
# aliases : remplace la commande tapée par la cible avant son exécution ('*' en fin d'alias : tous les arguments).
#
# Les messages de /shcooldowns et du mode réseau sont dans 'messages.yml'.
# ======================================================================== #

# Configuration for SHCooldowns
# Placeholders: %time% for remaining time
cooldown_message: "&7&l« &6&lSH &7&l» &7Veuillez attendre &6%time% &7avant d'utiliser cette commande à nouveau."
no_permission_message: "§7§l« §f§lSH §8§l» §fCommande inconnue, essayez autre chose." # Ajout pour clarté

cooldowns:
  # ID unique pour le groupe de cooldown (sera utilisé pour PAPI et permissions bypass)
  repair:
    # Cooldown appliqué si aucune entrée avec permission correspondante n'est trouvée ou si le joueur n'a pas la permission spécifiée
    default:
      cooldown: 1h # 1 heure
      shared_commands: # Commandes partageant ce cooldown PAR DÉFAUT
        - /fix # Commande de base, correspond aussi à /repair xyz sauf si une règle plus spécifique existe
    # vip:
    #   cooldown: 30m # 30 minutes pour les VIPs
    #   permission: shcooldowns.repairvip # Permission requise pour ce cooldown
    #   shared_commands: # Commandes partageant ce cooldown VIP
    #     - /repair
    #     - /erepair
    #     - /fix
    #     - /efix
    #     - /repair hand
    #     - /erepair hand
    #     - /fix hand
    #     - /efix hand
  repair_all:
    default:
      cooldown: 6h # 6 heures
      shared_commands:
        - /fix *
  kittycannon:
    default:
      cooldown: 10s # 10 secondes
      shared_commands:
        - /kittycannon
        - /ekittycannon

aliases:
  # Alias vers Cible (la commande exécutée sera la Cible)
  '/isgo': '/is go'
  '/mail read': '/mail'
  '/pw *': '/is warps'

# Message affiché par PAPI lorsque le joueur n'est pas en cooldown pour la commande demandée
placeholder_ready_message: "Prêt"

# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : les cooldowns sont alors écrits
# dans la base partagée (table shcooldowns : uuid, id, expiry) et relus à l'arrivée du joueur sur un serveur.
# Sans SHNetwork, rien de ceci n'est utilisé. Demande un redémarrage.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de relire ses cooldowns
  attente-max-secondes: 10
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: minecraft
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas
    # laisse le joueur utiliser ses commandes avec les cooldowns de ce serveur.
    delai-ms: 3000
